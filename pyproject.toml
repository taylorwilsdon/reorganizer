[project]
name = "reorganizer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3",
    "textual>=3.1.1",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["utils"]
py-modules = ["app", "cli_config", "main", "styles"]
